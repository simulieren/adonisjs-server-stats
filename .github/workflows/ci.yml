name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # @japa/runner 5 imports glob from node:fs/promises (Node 22+), so the
        # test toolchain cannot run on Node 20. The published package still
        # supports engines >=18 — only the dev/test tooling needs 22+.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --legacy-peer-deps: devDependencies deliberately pair @adonisjs/core v6
      # with packages whose peers want v7 (the package supports both majors);
      # strict peer resolution refuses that combination.
      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      - run: npm run lint

      # One child process per spec file: the combined single-process suite
      # aborts at exit on a better-sqlite3 environment-cleanup assert under
      # Node 22+, which also eats the japa summary. See
      # scripts/run-tests-split.mjs for details.
      - run: npm run test:ci

      - run: npm run build
